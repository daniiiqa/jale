[package]
name = "jale"
version = "0.1.0"
edition = "2024"
description = "El launcher de discada: apps y menús (dmenu, compatible con lo que se le mandaba a rofi), con el look del rice"
license = "MIT"

[dependencies]
disco = { git = "https://github.com/daniiiqa/disco", features = ["paint"] }
cosmic-text = "0.19.0"
libc = "0.2"
ratatui = "0.29"
serde_json = "1"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
tiny-skia = "0.12.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
